# SHUOMI-ERP PRIVATE CUSTOMIZATION: production/local deployment
# 生产独立编排：外部 MySQL + 独立 Redis + 后端 + 前端。
# docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --wait --pull never
# 只使用本文件；不要与本地 docker-compose.yml 合并。镜像须先 docker load。
name: shuomi-erp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: shuomi-erp-redis
    pull_policy: never
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置生产 Redis 密码}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请设置生产 Redis 密码}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  backend:
    image: ${IMAGE_PREFIX:-shuomi-erp}-backend:${IMAGE_TAG:?请设置发布版本 IMAGE_TAG}
    container_name: shuomi-erp-backend
    pull_policy: never
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?请设置外部生产 MySQL JDBC URL}
      DB_USERNAME: ${DB_USERNAME:?请设置生产数据库账号}
      DB_PASSWORD: ${DB_PASSWORD:?请设置生产数据库密码}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET，至少 32 字节}
      LEMON_AI_SECRET_KEY: ${LEMON_AI_SECRET_KEY:-}
      LEMON_TENANT_ENABLED: ${LEMON_TENANT_ENABLED:-false}
      LEMON_DEMO_ENABLED: ${LEMON_DEMO_ENABLED:-false}
      LEMON_MINIAPP_APP_ID: ${LEMON_MINIAPP_APP_ID:-}
      LEMON_MINIAPP_APP_SECRET: ${LEMON_MINIAPP_APP_SECRET:-}
      LEMON_MINIAPP_SUBSCRIBE_TEMPLATE_ID: ${LEMON_MINIAPP_SUBSCRIBE_TEMPLATE_ID:-}
      FLOWABLE_DATABASE_SCHEMA_UPDATE: ${FLOWABLE_DATABASE_SCHEMA_UPDATE:-false}
      UPLOAD_PATH: /data/uploads
      LEMON_UPLOAD_ATTACHMENTPATH: /data/attachments
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m}
    volumes:
      - lemon-files:/data
    stop_grace_period: 45s
    logging: *default-logging

  web:
    image: ${IMAGE_PREFIX:-shuomi-erp}-web:${IMAGE_TAG:?请设置发布版本 IMAGE_TAG}
    container_name: shuomi-erp
    pull_policy: never
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 1Panel/OpenResty 在宿主机网络时反代 127.0.0.1:18080。
      # 如果使用桥接网络，将 WEB_BIND_IP 改为可达的宿主机网桥 IP，并限制公网访问该端口。
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-18080}:80"
    logging: *default-logging

volumes:
  redis-data:
    name: shuomi-erp-redis-data
  lemon-files:
    name: shuomi-erp-files
